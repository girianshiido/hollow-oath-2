name: Deploy Hollow Oath II
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm build
      - name: Install responsive browser checks
        run: |
          mkdir -p .qa-tools
          npm install --prefix .qa-tools --no-save --package-lock=false playwright@1.56.1
          node .qa-tools/node_modules/playwright/cli.js install --with-deps chromium
      - name: Verify phone and tablet layouts
        run: node --experimental-strip-types scripts/check-responsive.mjs
      - name: Keep responsive screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: responsive-layouts
          path: qa/responsive/
          retention-days: 14
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
